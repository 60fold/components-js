name: Publish Sixtyfold packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish, or the complete suite
        required: true
        type: choice
        options:
          - all
          - core
          - line
          - stock
          - ssr
          - themes
          - react
          - vue
          - angular
          - svelte
          - solid
          - mcp
      channel:
        description: Publish an RC to `next`, or a reviewed stable release to `latest`
        required: true
        type: choice
        options:
          - rc
          - stable
      version:
        description: Exact package or suite version (for example 1.0.1-rc.1 or 1.0.1)
        required: true
        type: string
concurrency:
  group: sixtyfold-npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ssr-platforms:
    uses: ./.github/workflows/ssr-release-platforms.yml

  publish:
    name: Validate and publish
    needs: ssr-platforms
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    outputs:
      source_commit: ${{ steps.release-source.outputs.commit }}
    env:
      RELEASE_PACKAGE: ${{ inputs.package }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the default branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Package releases must be dispatched from main." >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/

      - name: Install pinned package managers
        run: |
          corepack enable
          corepack prepare pnpm@11.15.1 --activate
          npm install --global npm@11.18.0 --ignore-scripts

      - name: Record the release commit
        id: release-source
        run: |
          release_commit=$(git rev-parse HEAD)
          echo "commit=${release_commit}" >> "${GITHUB_OUTPUT}"

      - name: Validate release inputs and source versions
        run: |
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const packages = ["core", "line", "stock", "ssr", "themes", "react", "vue", "angular", "svelte", "solid", "mcp"];
          const packageDirectory = process.env.RELEASE_PACKAGE;
          const channel = process.env.RELEASE_CHANNEL;
          const version = process.env.RELEASE_VERSION;
          const stablePattern = /^\d+\.\d+\.\d+$/;
          const rcPattern = /^\d+\.\d+\.\d+-rc\.\d+$/;

          if (packageDirectory !== "all" && !packages.includes(packageDirectory)) {
            throw new Error(`Unknown release package: ${packageDirectory}`);
          }
          if (channel === "rc" && !rcPattern.test(version)) {
            throw new Error("RC releases require a version such as 1.0.0-rc.1");
          }
          if (channel === "stable" && !stablePattern.test(version)) {
            throw new Error("Stable releases require a version such as 1.0.0");
          }
          const sourceVersion = version.split("-rc.")[0];
          for (const directory of packages) {
            const manifest = JSON.parse(readFileSync(`packages/${directory}/package.json`, "utf8"));
            if (manifest.name !== `@sixtyfold/${directory}`) {
              throw new Error(`Unexpected package name: ${manifest.name}`);
            }
            if (manifest.version !== sourceVersion) {
              throw new Error(`${manifest.name} is ${manifest.version}; expected reviewed source version ${sourceVersion}`);
            }
          }
          NODE

      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check source formatting
        run: pnpm run format:check

      - name: Run semantic lint
        run: pnpm run lint

      - name: Check release version availability
        run: |
          node --input-type=module <<'NODE'
          const packages = ["core", "line", "stock", "ssr", "themes", "react", "vue", "angular", "svelte", "solid", "mcp"];
          const selectedPackages =
            process.env.RELEASE_PACKAGE === "all" ? packages : [process.env.RELEASE_PACKAGE];
          const version = process.env.RELEASE_VERSION;
          for (const directory of selectedPackages) {
            const packageName = `@sixtyfold/${directory}`;
            const url = `https://registry.npmjs.org/${encodeURIComponent(packageName)}/${encodeURIComponent(version)}`;
            const response = await fetch(url, { redirect: "error" });
            if (response.ok) {
              if (process.env.RELEASE_PACKAGE === "all") {
                console.log(`${packageName}@${version} already exists and will be skipped.`);
                continue;
              }
              throw new Error(`${packageName}@${version} already exists; npm versions are immutable.`);
            }
            if (response.status !== 404) {
              throw new Error(
                `Unable to establish ${packageName} availability: npm returned HTTP ${response.status}.`,
              );
            }
          }
          NODE

      - name: Build packages
        run: pnpm run build:packages

      - name: Typecheck packages
        run: pnpm run typecheck

      - name: Run unit and integration tests
        run: pnpm run test:unit

      - name: Enforce renderer coverage thresholds
        run: pnpm run test:coverage

      - name: Install the packed-browser test runtimes
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Exercise built renderer interactions and accessibility
        run: pnpm run test:e2e:built

      - name: Build and smoke-test framework examples
        run: |
          pnpm run build:examples
          node scripts/check-framework-examples.mjs

      - name: Verify complete reviewed source packages
        run: node scripts/check-packed-release.mjs

      - name: Apply the suite release version in the ephemeral runner
        run: >-
          node scripts/stamp-release-manifests.mjs
          --all
          --version "${RELEASE_VERSION}"

      - name: Build and pack release artifacts
        env:
          # The manifests were deliberately stamped after the frozen install.
          # Do not let pnpm 11 replace that reviewed install from the ephemeral versions.
          pnpm_config_verify_deps_before_run: "false"
        run: |
          pack_dir="${RUNNER_TEMP}/sixtyfold-pack"
          mkdir -p "${pack_dir}"

          if [ "${RELEASE_PACKAGE}" = "all" ]; then
            packages=(core line stock ssr themes react vue angular svelte solid mcp)
            build_packages=(core line stock ssr themes react vue angular svelte solid)
            for directory in "${build_packages[@]}"; do
              pnpm --filter "@sixtyfold/${directory}" run build
            done
            pnpm run mcp:catalog
            pnpm --filter @sixtyfold/mcp run build
            pnpm run check:mcp-catalog
            pnpm run check:mcp-guidance
          else
            packages=("${RELEASE_PACKAGE}")
            if [ "${RELEASE_PACKAGE}" = "mcp" ]; then pnpm run mcp:catalog; fi
            pnpm --filter "@sixtyfold/${RELEASE_PACKAGE}" run build
          fi

          for directory in "${packages[@]}"; do
            package_dir="packages/${directory}"
            if [ "${directory}" = "angular" ]; then package_dir="${package_dir}/dist"; fi
            pnpm --dir "${package_dir}" pack --pack-destination "${pack_dir}"
          done

      - name: Verify exact artifacts selected for publication
        run: |
          if [ "${RELEASE_PACKAGE}" = "all" ]; then
            node scripts/check-packed-release.mjs \
              --tarballs-dir "${RUNNER_TEMP}/sixtyfold-pack"
          else
            node scripts/check-packed-release.mjs \
              --package "${RELEASE_PACKAGE}" \
              --tarballs-dir "${RUNNER_TEMP}/sixtyfold-pack"
          fi

      - name: Require published runtime dependencies
        if: inputs.package != 'all'
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const tarball = `${process.env.RUNNER_TEMP}/sixtyfold-pack/sixtyfold-${process.env.RELEASE_PACKAGE}-${process.env.RELEASE_VERSION}.tgz`;
          const manifest = JSON.parse(
            execFileSync("tar", ["-xOf", tarball, "package/package.json"], {
              encoding: "utf8",
            }),
          );
          const dependencies = {
            ...(manifest.dependencies ?? {}),
            ...(manifest.optionalDependencies ?? {}),
            ...Object.fromEntries(
              Object.entries(manifest.peerDependencies ?? {}).filter(
                ([name]) => manifest.peerDependenciesMeta?.[name]?.optional !== true,
              ),
            ),
          };
          for (const [name, range] of Object.entries(dependencies)) {
            if (!name.startsWith("@sixtyfold/")) continue;
            try {
              execFileSync("npm", ["view", `${name}@${range}`, "version", "--json"], {
                encoding: "utf8",
                stdio: ["ignore", "pipe", "pipe"],
              });
            } catch {
              throw new Error(
                `${manifest.name}@${manifest.version} requires ${name}@${range}, but npm cannot resolve that dependency. Publish the dependency first.`,
              );
            }
          }
          NODE

      - name: Publish with npm trusted publishing
        env:
          DIST_TAG: ${{ inputs.channel == 'stable' && 'latest' || 'next' }}
        run: |
          set -o pipefail
          pack_dir="${RUNNER_TEMP}/sixtyfold-pack"

          registry_state() {
            local package_name="$1"
            RELEASE_PACKAGE_NAME="${package_name}" node --input-type=module <<'NODE'
          const packageName = process.env.RELEASE_PACKAGE_NAME;
          const version = process.env.RELEASE_VERSION;
          const versionUrl =
            `https://registry.npmjs.org/${encodeURIComponent(packageName)}/` +
            encodeURIComponent(version);
          const response = await fetch(versionUrl, { redirect: "error" });
          if (response.ok) {
            const metadata = await response.json();
            if (metadata.version !== version) {
              throw new Error(
                `npm returned ${metadata.version} while checking ${packageName}@${version}.`,
              );
            }
            console.log("published");
          } else if (response.status === 404) {
            const packageUrl = `https://registry.npmjs.org/${encodeURIComponent(packageName)}`;
            const packageResponse = await fetch(packageUrl, { redirect: "error" });
            if (packageResponse.ok) {
              console.log("public");
            } else if (packageResponse.status === 404) {
              console.log("missing");
            } else {
              throw new Error(
                `Unable to read ${packageName}: npm returned HTTP ${packageResponse.status}.`,
              );
            }
          } else {
            throw new Error(
              `Unable to read ${packageName}@${version}: npm returned HTTP ${response.status}.`,
            );
          }
          NODE
          }

          wait_for_registry() {
            local package_name="$1"
            RELEASE_PACKAGE_NAME="${package_name}" DIST_TAG="${DIST_TAG}" node --input-type=module <<'NODE'
          const packageName = process.env.RELEASE_PACKAGE_NAME;
          const version = process.env.RELEASE_VERSION;
          const tag = process.env.DIST_TAG;
          const packageUrl = `https://registry.npmjs.org/${encodeURIComponent(packageName)}`;
          const versionUrl = `${packageUrl}/${encodeURIComponent(version)}`;

          for (let attempt = 1; attempt <= 12; attempt += 1) {
            const [versionResponse, packageResponse] = await Promise.all([
              fetch(versionUrl, { redirect: "error" }),
              fetch(`${packageUrl}?release_check=${Date.now()}`, {
                headers: { "cache-control": "no-cache" },
                redirect: "error",
              }),
            ]);
            if (versionResponse.ok && packageResponse.ok) {
              const [metadata, packument] = await Promise.all([
                versionResponse.json(),
                packageResponse.json(),
              ]);
              if (metadata.version !== version) {
                throw new Error(
                  `npm returned ${metadata.version} while checking ${packageName}@${version}.`,
                );
              }
              if (packument["dist-tags"]?.[tag] === version) process.exit(0);
            } else if (
              ![200, 404].includes(versionResponse.status) ||
              ![200, 404].includes(packageResponse.status)
            ) {
              throw new Error(
                `Unable to verify ${packageName}@${version}: npm returned HTTP ` +
                  `${versionResponse.status}/${packageResponse.status}.`,
              );
            }
            await new Promise((resolve) => setTimeout(resolve, 10_000));
          }
          throw new Error(
            `npm did not expose ${packageName}@${version} on ${tag} within two minutes.`,
          );
          NODE
          }

          publish_package() {
            local directory="$1"
            local package_name="@sixtyfold/${directory}"
            local archive="${pack_dir}/sixtyfold-${directory}-${RELEASE_VERSION}.tgz"
            local state
            state=$(registry_state "${package_name}")

            if [ "${state}" = "published" ]; then
              if [ "${RELEASE_PACKAGE}" != "all" ]; then
                echo "${package_name}@${RELEASE_VERSION} already exists." >&2
                return 1
              fi
              echo "Skipping existing ${package_name}@${RELEASE_VERSION}."
              wait_for_registry "${package_name}"
              return
            fi

            if publish_output=$(npm publish "${archive}" --access public --tag "${DIST_TAG}" 2>&1); then
              printf '%s\n' "${publish_output}"
              wait_for_registry "${package_name}"
              return
            else
              publish_status=$?
            fi

            printf '%s\n' "${publish_output}" >&2
            if ! grep -q "E409" <<<"${publish_output}"; then
              return "${publish_status}"
            fi

            echo "npm is processing the public-access transition for ${package_name}; waiting before one safe retry."
            for attempt in {1..12}; do
              sleep 10
              state=$(registry_state "${package_name}")
              if [ "${state}" = "published" ]; then
                wait_for_registry "${package_name}"
                return
              fi
              if [ "${state}" = "public" ]; then
                npm publish "${archive}" --access public --tag "${DIST_TAG}"
                wait_for_registry "${package_name}"
                return
              fi
            done
            echo "npm did not finish the public-access transition for ${package_name}." >&2
            return 1
          }

          if [ "${RELEASE_PACKAGE}" = "all" ]; then
            packages=(core line stock themes ssr react vue angular svelte solid mcp)
          else
            packages=("${RELEASE_PACKAGE}")
          fi
          for directory in "${packages[@]}"; do
            publish_package "${directory}"
          done

  github-release:
    name: Publish GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.source_commit }}

      - name: Create the version tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PACKAGE: ${{ inputs.package }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SOURCE_COMMIT: ${{ needs.publish.outputs.source_commit }}
        run: |
          if [ "${RELEASE_PACKAGE}" = "all" ]; then
            packages=(core line stock themes ssr react vue angular svelte solid mcp)
          else
            packages=("${RELEASE_PACKAGE}")
          fi
          for directory in "${packages[@]}"; do
            tag="${directory}-v${RELEASE_VERSION}"
            if gh release view "${tag}" >/dev/null 2>&1; then
              if [ "${RELEASE_PACKAGE}" = "all" ]; then
                echo "Skipping existing GitHub release ${tag}."
                continue
              fi
              echo "GitHub release ${tag} already exists." >&2
              exit 1
            fi
            arguments=(
              "${tag}"
              --target "${RELEASE_SOURCE_COMMIT}"
              --title "@sixtyfold/${directory} ${RELEASE_VERSION}"
              --generate-notes
            )
            if [ "${RELEASE_CHANNEL}" = "rc" ]; then
              arguments+=(--prerelease --latest=false)
            else
              arguments+=(--latest)
            fi
            gh release create "${arguments[@]}"
          done
