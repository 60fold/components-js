name: SSR release platform gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: SSR visual reference (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
          - windows-latest
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Install pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.15.1 --activate

      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build SSR renderer dependencies
        run: |
          pnpm --filter @sixtyfold/core run build
          pnpm --filter @sixtyfold/line run build
          pnpm --filter @sixtyfold/stock run build
          pnpm --filter @sixtyfold/ssr run build

      - name: Validate pinned SSR pixels and rasterized text
        run: pnpm run test:ssr:node
